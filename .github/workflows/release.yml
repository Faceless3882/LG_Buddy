name: Release promotion

on:
  push:
    branches:
      - main
      - prerelease

permissions:
  actions: read
  contents: read

concurrency:
  group: release-promotion
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      base_sha: ${{ steps.contract.outputs.base_sha }}
      channel: ${{ steps.contract.outputs.channel }}
      head_sha: ${{ steps.contract.outputs.head_sha }}
      prerelease_sha: ${{ steps.contract.outputs.prerelease_sha }}
      prepare: ${{ steps.contract.outputs.prepare }}
      source_sha: ${{ steps.contract.outputs.source_sha }}
      tag: ${{ steps.contract.outputs.tag }}
      version: ${{ steps.contract.outputs.version }}

    steps:
      - name: Check out merged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch release refs and tags
        run: |
          git fetch --force origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/prerelease:refs/remotes/origin/prerelease \
              +refs/heads/dev:refs/remotes/origin/dev \
              +refs/tags/*:refs/tags/*

      - name: Validate merged promotion
        id: contract
        env:
          BASE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          TARGET: ${{ github.ref_name }}
        run: |
          python3 scripts/release_promotion.py \
              --merged \
              --target "$TARGET" \
              --head-ref "$HEAD_SHA" \
              --base-sha "$BASE_SHA" \
              --github-output "$GITHUB_OUTPUT"

  build-release-bundle:
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-24.04
    needs: validate

    steps:
      - name: Check out merged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl,x86_64-unknown-linux-gnu

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install release prerequisites
        run: sudo apt-get update && sudo apt-get install -y at-spi2-core binutils dbus-x11 libadwaita-1-dev libgtk-4-dev musl-tools python3-pyatspi strace xdotool xvfb zenity

      - name: Build headless runtime and GTK GUI
        env:
          LG_BUDDY_BUILD_COMMIT: ${{ needs.validate.outputs.head_sha }}
          LG_BUDDY_RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          pkg-config --atleast-version=4.14 gtk4
          pkg-config --atleast-version=1.5 libadwaita-1
          cargo build --locked --release -p lg-buddy --target x86_64-unknown-linux-musl
          cargo build --locked --release -p lg-buddy-gui --target x86_64-unknown-linux-gnu

      - name: Create release bundle
        run: ./scripts/build-release-bundle.sh --target x86_64-unknown-linux-musl --gui-target x86_64-unknown-linux-gnu --version "${{ needs.validate.outputs.version }}" --output-dir dist

      - name: Smoke test release bundle
        run: |
          dbus-run-session -- xvfb-run -a env ADW_DISABLE_PORTAL=1 GDK_BACKEND=x11 GDK_DEBUG=no-portals NO_AT_BRIDGE=1 ./scripts/test-release-bundle.sh \
              --skip-pip-install \
              --work-dir "$RUNNER_TEMP/release-bundle-smoke" \
              --archive "dist/lg-buddy-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz" \
              --expected-tag "${{ needs.validate.outputs.tag }}" \
              --expected-version "${{ needs.validate.outputs.version }}" \
              --expected-channel "${{ needs.validate.outputs.channel }}" \
              --expected-target x86_64-unknown-linux-musl \
              --expected-commit "${{ needs.validate.outputs.head_sha }}"

      - name: Download pinned cross-version baseline
        run: |
          curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz" \
              https://github.com/Staphylococcus/LG_Buddy/releases/download/v1.4.0-beta.2/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz

      - name: Smoke test cross-version upgrade
        run: |
          ./scripts/test-cross-version-upgrade.sh \
              --previous-archive "$RUNNER_TEMP/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz" \
              --previous-sha256 883e6cb869cbe60988a195acac2e15864d904797edfefbb7d90052eff9a17d32 \
              --previous-tag v1.4.0-beta.2 \
              --previous-version 1.4.0-beta.2 \
              --previous-channel prerelease \
              --previous-target x86_64-unknown-linux-musl \
              --previous-commit 77c8f46c66b9e385f3d90c15dee33d775639bbeb \
              --candidate-archive "dist/lg-buddy-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz" \
              --candidate-tag "${{ needs.validate.outputs.tag }}" \
              --candidate-version "${{ needs.validate.outputs.version }}" \
              --candidate-channel "${{ needs.validate.outputs.channel }}" \
              --candidate-target x86_64-unknown-linux-musl \
              --candidate-commit "${{ needs.validate.outputs.head_sha }}"

      - name: Generate checksums
        run: |
          cd dist
          sha256sum ./*.tar.gz > sha256sums.txt

      - name: Verify checksums
        run: |
          cd dist
          sha256sum -c sha256sums.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v6
        with:
          name: lg-buddy-release-${{ needs.validate.outputs.tag }}
          path: |
            dist/*.tar.gz
            dist/sha256sums.txt
          if-no-files-found: error
          retention-days: 35

  stage-release-draft:
    name: stage-release-draft
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    environment: release-promotion
    needs:
      - validate
      - build-release-bundle

    steps:
      - name: Check out merged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch and revalidate release refs
        run: |
          git fetch --force origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/prerelease:refs/remotes/origin/prerelease \
              +refs/heads/dev:refs/remotes/origin/dev \
              +refs/tags/*:refs/tags/*
          python3 scripts/release_promotion.py \
              --merged \
              --target "${{ github.ref_name }}" \
              --head-ref "${{ needs.validate.outputs.head_sha }}" \
              --base-sha "${{ needs.validate.outputs.base_sha }}"

      - name: Download verified release bundle
        uses: actions/download-artifact@v7
        with:
          name: lg-buddy-release-${{ needs.validate.outputs.tag }}
          path: dist

      - name: Verify downloaded checksums
        run: cd dist && sha256sum -c sha256sums.txt

      - name: Revalidate downloaded bundle identities
        run: |
          python3 scripts/release_bundle_manifest.py validate \
              --archive "dist/lg-buddy-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz" \
              --expected-release-tag "${{ needs.validate.outputs.tag }}" \
              --expected-version "${{ needs.validate.outputs.version }}" \
              --expected-channel "${{ needs.validate.outputs.channel }}" \
              --expected-target x86_64-unknown-linux-musl \
              --expected-gui-target x86_64-unknown-linux-gnu \
              --expected-commit "${{ needs.validate.outputs.head_sha }}"

      - name: Create repository-scoped release token
        id: release-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.RELEASE_PROMOTION_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_PROMOTION_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: LG_Buddy
          permission-contents: write

      - name: Align release streams
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          PRERELEASE_SHA: ${{ needs.validate.outputs.prerelease_sha }}
          SOURCE_SHA: ${{ needs.validate.outputs.source_sha }}
          TARGET: ${{ github.ref_name }}
        run: |
          update_ref() {
              local ref_name="$1"
              local expected_sha="$2"
              local current_sha=""

              current_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$ref_name" --jq .object.sha)"
              if [ "$current_sha" = "$HEAD_SHA" ]; then
                  return
              fi
              [ "$current_sha" = "$expected_sha" ] || {
                  echo "$ref_name moved from $expected_sha to $current_sha."
                  exit 1
              }
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/heads/$ref_name" \
                  -f sha="$HEAD_SHA" \
                  -F force=false >/dev/null
          }

          if [ "$TARGET" = "main" ]; then
              update_ref prerelease "$PRERELEASE_SHA"
          fi
          update_ref dev "$SOURCE_SHA"

      - name: Stage verified release draft
        env:
          GH_TOKEN: ${{ steps.release-token.outputs.token }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          if remote_tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha 2>/dev/null)"; then
              [ "$remote_tag_sha" = "$HEAD_SHA" ] || {
                  echo "Tag $RELEASE_TAG points to $remote_tag_sha, expected $HEAD_SHA."
                  exit 1
              }
          else
              gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f ref="refs/tags/$RELEASE_TAG" \
                  -f sha="$HEAD_SHA" >/dev/null
          fi

          if ! git rev-parse --verify "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
              git tag "$RELEASE_TAG" "$HEAD_SHA"
          fi
          ./scripts/publish-release-assets.sh stage-draft \
              --dist-dir dist \
              --tag "$RELEASE_TAG" \
              --commit "$HEAD_SHA"

          release_url="$(gh release view "$RELEASE_TAG" --json url --jq .url)"
          {
              echo "## Verified release draft"
              echo
              echo "[$RELEASE_TAG]($release_url) is ready for release-note review."
              echo "After reviewing the draft and its assets, approve the release-publication environment to publish it."
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: publish-reviewed-release
    if: needs.validate.outputs.prepare == 'true'
    runs-on: ubuntu-latest
    environment: release-publication
    permissions:
      actions: read
      contents: write
    needs:
      - validate
      - build-release-bundle
      - stage-release-draft

    steps:
      - name: Check out staged release commit
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Fetch and revalidate release refs
        run: |
          git fetch --force origin \
              +refs/heads/main:refs/remotes/origin/main \
              +refs/heads/prerelease:refs/remotes/origin/prerelease \
              +refs/heads/dev:refs/remotes/origin/dev \
              +refs/tags/*:refs/tags/*
          python3 scripts/release_promotion.py \
              --merged \
              --target "${{ github.ref_name }}" \
              --head-ref "${{ needs.validate.outputs.head_sha }}" \
              --base-sha "${{ needs.validate.outputs.base_sha }}"

      - name: Download staged release bundle
        uses: actions/download-artifact@v7
        with:
          name: lg-buddy-release-${{ needs.validate.outputs.tag }}
          path: dist

      - name: Verify staged checksums
        run: cd dist && sha256sum -c sha256sums.txt

      - name: Revalidate staged bundle identity
        run: |
          python3 scripts/release_bundle_manifest.py validate \
              --archive "dist/lg-buddy-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz" \
              --expected-release-tag "${{ needs.validate.outputs.tag }}" \
              --expected-version "${{ needs.validate.outputs.version }}" \
              --expected-channel "${{ needs.validate.outputs.channel }}" \
              --expected-target x86_64-unknown-linux-musl \
              --expected-gui-target x86_64-unknown-linux-gnu \
              --expected-commit "${{ needs.validate.outputs.head_sha }}"

      - name: Publish reviewed release draft
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.validate.outputs.head_sha }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        run: |
          ./scripts/publish-release-assets.sh publish-draft \
              --dist-dir dist \
              --tag "$RELEASE_TAG" \
              --commit "$HEAD_SHA"

          verify_dir="$(mktemp -d)"
          gh release download "$RELEASE_TAG" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c sha256sums.txt)
          python3 scripts/release_bundle_manifest.py validate \
              --archive "$verify_dir/lg-buddy-${{ needs.validate.outputs.version }}-x86_64-unknown-linux-musl.tar.gz" \
              --expected-release-tag "$RELEASE_TAG" \
              --expected-version "${{ needs.validate.outputs.version }}" \
              --expected-channel "${{ needs.validate.outputs.channel }}" \
              --expected-target x86_64-unknown-linux-musl \
              --expected-gui-target x86_64-unknown-linux-gnu \
              --expected-commit "$HEAD_SHA"

  production-prerelease-canary:
    name: production-prerelease-canary
    if: needs.validate.outputs.prepare == 'true' && needs.validate.outputs.channel == 'prerelease'
    runs-on: ubuntu-latest
    needs:
      - validate
      - publish

    steps:
      - name: Check out published prerelease
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate.outputs.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install canary prerequisites
        run: sudo apt-get update && sudo apt-get install -y libadwaita-1-0 libgtk-4-1 python3-venv util-linux zenity

      - name: Download pinned updater-capable baseline
        run: |
          curl --fail --silent --show-error --location \
              --proto '=https' --tlsv1.2 \
              --output "$RUNNER_TEMP/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz" \
              https://github.com/Staphylococcus/LG_Buddy/releases/download/v1.4.0-beta.2/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz

      - name: Exercise production GitHub upgrade path
        run: |
          ./scripts/test-production-upgrade-canary.sh \
              --work-dir "$RUNNER_TEMP/production-canary" \
              --previous-archive "$RUNNER_TEMP/lg-buddy-1.4.0-beta.2-x86_64-unknown-linux-musl.tar.gz" \
              --previous-sha256 883e6cb869cbe60988a195acac2e15864d904797edfefbb7d90052eff9a17d32 \
              --previous-tag v1.4.0-beta.2 \
              --previous-version 1.4.0-beta.2 \
              --previous-channel prerelease \
              --previous-target x86_64-unknown-linux-musl \
              --previous-commit 77c8f46c66b9e385f3d90c15dee33d775639bbeb \
              --expected-tag "${{ needs.validate.outputs.tag }}" \
              --expected-version "${{ needs.validate.outputs.version }}" \
              --expected-channel prerelease \
              --expected-target x86_64-unknown-linux-musl \
              --expected-commit "${{ needs.validate.outputs.head_sha }}"

      - name: Record sanitized production GitHub responses
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/record_github_release_responses.py \
              --repository "$GITHUB_REPOSITORY" \
              --tag "${{ needs.validate.outputs.tag }}" \
              --output "$RUNNER_TEMP/production-canary/github-responses.json"

      - name: Upload canary evidence for the offline mock
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: production-upgrade-canary-${{ needs.validate.outputs.tag }}
          path: |
            ${{ runner.temp }}/production-canary/production-upgrade-canary.output
            ${{ runner.temp }}/production-canary/github-responses.json
          if-no-files-found: warn
          retention-days: 30
