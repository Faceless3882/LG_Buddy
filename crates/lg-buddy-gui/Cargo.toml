[package]
name = "lg-buddy-gui"
version = "1.4.0"
edition = "2021"
publish = false

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["gtk_v4_10"] }
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_10"] }
lg-buddy = { path = "../lg-buddy" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "lg-buddy-gui"
path = "src/main.rs"
