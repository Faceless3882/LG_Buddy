[package]
name = "lg-buddy"
version = "1.2.2"
edition = "2021"
publish = false

[dependencies]
dbus = { version = "0.9.11", features = ["vendored"] }
dbus-crossroads = "0.5.3"
evdev = "0.13.2"
libc = "0.2"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "2"
wayland-client = { version = "0.31.15", default-features = false }
wayland-protocols = { version = "0.32.13", default-features = false, features = ["client", "staging"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "lg-buddy"
path = "src/main.rs"

[dev-dependencies]
base64 = "0.22"
cucumber = "0.22.1"
tokio = { version = "1", features = ["macros", "rt"] }

[[test]]
name = "cucumber"
path = "tests/cucumber.rs"
harness = false
